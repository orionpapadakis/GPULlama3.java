name: Setup Java
description: Install and activate a JDK via SDKMAN. Exports JAVA_HOME and updates PATH.

inputs:
  java_version:
    description: 'SDKMAN Java version identifier (e.g. 21.0.2-open)'
    required: true

runs:
  using: composite
  steps:
    - name: Set up Java with SDKMAN
      shell: bash
      run: |
        set -euo pipefail
        VERSION='${{ inputs.java_version }}'
        CANDIDATE="$HOME/.sdkman/candidates/java/$VERSION"

        # SDKMAN's helpers use bash 4+ parameter expansion (${var^^} in
        # sdkman-path-helpers.sh). The Linux runners have bash 5 as /bin/bash and are
        # fine; macOS ships bash 3.2, which is what `shell: bash` resolves to there, so
        # sourcing sdkman-init.sh fails with "bad substitution". Pick a bash >= 4
        # explicitly instead of relying on whichever one `shell: bash` found.
        SDK_BASH=""
        for c in "$(command -v bash || true)" /opt/homebrew/bin/bash /usr/local/bin/bash /bin/bash; do
          [ -n "$c" ] && [ -x "$c" ] || continue
          if [ "$("$c" -c 'echo ${BASH_VERSINFO[0]}' 2>/dev/null || echo 0)" -ge 4 ]; then
            SDK_BASH="$c"
            break
          fi
        done
        if [ -z "$SDK_BASH" ]; then
          echo "::error::SDKMAN requires bash >= 4 and none was found." \
               "On macOS the system bash is 3.2 — install a newer one (brew install bash)."
          exit 1
        fi
        echo "Using $SDK_BASH ($("$SDK_BASH" -c 'echo $BASH_VERSION')) for SDKMAN."

        # No `set -u` here: sdkman-init.sh reads unset variables (SDKMAN_CANDIDATES_API and
        # others), so nounset turns its own initialization into an error.
        "$SDK_BASH" -e -o pipefail -c '
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          if ! sdk list java | grep -q "$1"; then
            sdk install java "$1"
          fi
          sdk use java "$1"
        ' _ "$VERSION"

        # sdk use only affects that subshell, as it did the previous shell here; these two
        # exports are what actually carry the JDK into the following steps.
        if [ ! -x "$CANDIDATE/bin/java" ]; then
          echo "::error::Expected a JDK at $CANDIDATE after SDKMAN setup, but found none."
          exit 1
        fi
        echo "JAVA_HOME=$CANDIDATE" >> "$GITHUB_ENV"
        echo "$CANDIDATE/bin" >> "$GITHUB_PATH"
        "$CANDIDATE/bin/java" -version
